<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Republish site</title>
  <style>
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #14213d;
      color: #f4f1e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 16px;
    }
    button {
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #e0392a;
      color: #f4f1e8;
      border: 2px solid #e0392a;
      border-radius: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { color: #f4f1e8; opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <button id="btn">Republish site</button>
  <p id="status"></p>

  <script>
    // Paste your Vercel Deploy Hook URL below (Vercel → Project →
    // Settings → Git → Deploy Hooks). Keep this file private — anyone
    // with the URL can trigger a rebuild.
    const DEPLOY_HOOK_URL = 'PASTE_YOUR_VERCEL_DEPLOY_HOOK_URL_HERE';

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Triggering rebuild…';
      try {
        await fetch(DEPLOY_HOOK_URL, { method: 'POST' });
        status.textContent = 'Rebuild triggered. Live in about a minute.';
      } catch (e) {
        status.textContent = 'Something went wrong — check the deploy hook URL.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
